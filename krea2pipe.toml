# Krea2pipe configuration
#
# Quick start:
#   1. Select `prompt-mode = "source"` or `prompt-mode = "theme"`.
#   2. Configure the matching source or theme block below.
#   3. Set `output-dir` to a persistent directory.
#   4. Run: krea2pipe --config krea2pipe.toml
#
# Only settings for the selected mode are used; the other mode is ignored.
# For a one-time prompt, pass `--prompt` on the CLI to ignore both modes.
# Source mode uses filesystem events; theme mode runs continuously.
# A full source reconciliation runs every 300 seconds as a safety net.
#
# Path resolution:
#   - Relative source and output paths use the process working directory.
#   - The TOML file's directory does not affect relative paths.
#   - Model-root must be absolute; checkpoint names may be relative to it.
#   - The supplied systemd unit uses WorkingDirectory=/home/azadmin/krea2.
#
# Operational state:
#   - Source queue: OUTPUT_DIR/.krea2pipe-source.sqlite3.
#   - Theme progress: OUTPUT_DIR/.krea2pipe-theme-progress.json.
#   - Existing .krea2pipe-progress.tsv files are imported once.
#   - WAL NORMAL avoids per-image fsync; abrupt power loss may replay work.
#
# Keep this file flat: use these keys rather than TOML [section] tables.

# --- Input mode ---
# Only the block selected by prompt-mode is validated and used.
# Source entries include paths; entries beginning with ! exclude paths and never re-
# include them.
# Source mode stores its queue in output-dir/.krea2pipe-source.sqlite3 using WAL
# synchronous=NORMAL.
# Use `krea2pipe --config FILE --reset-status` to clear completion state without
# deleting images.
#
# Select the active source or theme block; CLI --prompt ignores both
prompt-mode = "source"

# SOURCE MODE: Git-style glob list where normal entries include and leading ! entries
# exclude; supports *, **, ?, and character classes; regex is not supported; concrete
# folders recursively include .txt, .text, .prompt, and .prompts files; concrete files
# are included regardless of extension; relative entries resolve from the process
# working directory
# sources = [
#   "/data/krea2/prompts/**/*.txt",
#   "/data/krea2/special.prompts",
#   "!/data/krea2/prompts/archive/**",
#   "!/data/krea2/prompts/**/draft-?.txt",
# ]
# SOURCE MODE ONLY: filesystem events ingest new files immediately; this full metadata
# scan recovers missed events, and 0 consumes current files then exits
# reconcile-interval = 300

# THEME MODE: subject and requirements that resident Qwen expands into image prompts
# theme = "A visual theme for Qwen to expand into varied prompts"
# THEME MODE ONLY: editable Qwen expansion instructions; the generated value is Krea
# 2's official system prompt
theme-system-prompt = '''
You are an expert prompt engineer for text-to-image models. Your task is to expand the user's prompt into a highly effective image-generation prompt.

Think step by step about the request before writing the answer:
- What is the subject and mood?
- What visual styles, mediums, and lighting options would fit? Consider two or three alternatives and pick the one that best serves the caption.
- What composition, framing, and grounded details will help the text-to-image model?

Then output a single expanded prompt paragraph.

Follow these rules strictly:
1. **Faithfulness First:** Preserve all original subjects, actions, colors, and spatial relationships. Do not add new objects, props, characters, or animals unless the user clearly implies them.
2. **Practical T2I Structure:** Write a prompt that a text-to-image model can parse cleanly. Group subjects with their own attributes and actions. Use grounded phrasing for poses, interactions, and spatial layout.
3. **Style Planning Stays Internal:** Use your internal reasoning to choose style, medium, framing, and lighting. Do not emit planning tags or wrappers in the visible answer body.
4. **Text Rendering:** If the user requests visible text, quotes, labels, or typography, specify the exact text clearly and wrap requested words in quotes.
5. **Avoid Over-Specification:** Do not invent highly specific clothing, colors, materials, or scene details unless the input supports them.
6. **Structure:** Write one cohesive paragraph after the thinking block. No bullets, JSON, or markdown.
7. **Respect Existing Detail:** If the user's prompt is already detailed, lightly polish and finalize rather than heavily expanding — preserve their phrasing and direction.
8. **Respect the Human Form:** Treat depictions of people with dignity. Assume clothing covers genitals and intimate anatomy.
9. **Preserve User Medium:** When the user explicitly requests a medium (e.g. "photo of", "photograph of", "illustration of", "painting of", "sketch of", "3D render of"), honor it. Do not pivot to a different medium to avoid difficulty — match the user's stated intent.'''
# THEME MODE ONLY: total expansion count; omitted or 0 continues until interrupted,
# while a positive value is resumable and finite
# prompt-count = 0

# --- Resolution ---
# Width and height override aspect-ratio and megapixels only when both are set.
# Base dimensions are rounded to multiple-of before upscaling.
#
# 1:1, 2:3, 3:2, 3:4, 4:3, 9:16, 16:9, or 21:9
aspect-ratio = "1:1"
# Approximate base-image area before USDU and SeedVR2 upscaling
megapixels = 1.5
# Round computed width and height to this model-safe multiple
multiple-of = 32
# Exact base width override; set height as well
# width = 1248
# Exact base height override; set width as well
# height = 1248
# Number of independent images generated together for each prompt; larger values
# increase VRAM usage
batch-size = 1

# --- Sampling ---
# Random seeds are resolved once per process and embedded in every output image.
# File prompts receive stable path/line/content offsets; theme seeds resume from the
# atomic theme progress file.
#
# Integer seed or 'random' (chosen once at startup)
seed = "random"
# Base Krea 2 diffusion steps
steps = 8
# Base guidance scale; 1 matches Krea 2 and skips negative guidance
cfg = 1.0
# Base sampler: euler or euler_ancestral
sampler = "euler_ancestral"
# Base scheduler: normal, sgm_uniform, or simple
scheduler = "sgm_uniform"

# --- Models ---
# Model-root must be absolute; individual checkpoint values may be absolute or
# relative to their category folder.
#
# Absolute model-library root containing diffusion_models, text_encoders, vae, loras,
# upscale_models, and SEEDVR2
model-root = "/data/ComfyUI/models"
# Krea 2 checkpoint under model-root/diffusion_models
unet = "moodyKrea2Mix_v50BF16.safetensors"
# Qwen text encoder under model-root/text_encoders
clip = "qwen3vl_4b_bf16.safetensors"
# Qwen Image VAE under model-root/vae
vae = "qwen_image_vae.safetensors"
# LoRAs under model-root/loras, applied in listed order with independent strengths;
# use an empty array to disable all LoRAs
loras = [
  { name = "atmospheric photography.safetensors", strength = 0.6 },
]
# Model under model-root/upscale_models used by UltimateSDUpscale
upscale-model = "4xNomosWebPhoto_RealPLKSR.pth"

# --- UltimateSDUpscale ---
# UltimateSDUpscale output scale relative to the base image
usdu-upscale-by = 2.0
# Integer seed or 'random' (chosen once at startup)
usdu-seed = "random"
# Diffusion steps per USDU tile
usdu-steps = 2
# Upscale sampler: euler or euler_ancestral
usdu-sampler = "euler"
# Upscale scheduler: normal, sgm_uniform, or simple
usdu-scheduler = "simple"
# Tile denoise strength from 0 to 1; higher values alter more detail
usdu-denoise = 0.1
# Tile traversal/seam-fixing mode: Linear, Chess, or None
usdu-mode = "Chess"

# --- ColorMatch ---
# Run the standalone ColorMatch stage after UltimateSDUpscale
run-color-match = true
# Color transfer: default, hm, reinhard, mvgd, mkl, hm-mvgd-hm, or hm-mkl-hm
color-match-method = "hm-mkl-hm"
# Transfer strength from 0 (off) to 1 (full)
color-match-strength = 0.22

# --- SeedVR2 ---
# Target short-edge pixels; aspect ratio is preserved
seedvr2-resolution = 4096
# Long-edge pixel cap used to limit VRAM
seedvr2-max-resolution = 4096
# 32-bit integer seed or 'random' (chosen once at startup)
seedvr2-seed = "random"
# SeedVR2 DiT checkpoint under model-root/SEEDVR2
seedvr2-model = "seedvr2_ema_7b_fp16.safetensors"
# SeedVR2-internal correction: none, wavelet, adain, or lab
seedvr2-color-correction = "lab"

# --- Upscale blend ---
# Run the separate model-upscale/Lanczos blend after SeedVR2
run-blend = true
# Model under model-root/upscale_models used only by final blend
blend-upscale-model = "4xNomosWebPhoto_RealPLKSR.pth"
# Blend strength from 0 to 1
blend-factor = 0.4
# Normal, multiply, screen, overlay, soft_light, or difference
blend-mode = "normal"

# --- Output ---
# PNG, JPEG, and WebP include the versioned generation manifest and A1111-compatible
# parameters.
# Relative output paths resolve from the process working directory, not from the TOML
# file location.
#
# Persistent output root for images, the SQLite source queue, theme progress, and the
# process lock; relative paths resolve from the working directory
output-dir = "output"
# Filename template supporting %time, %date, %width, %height, and %counter; collisions
# are resolved safely
filename = "%time"
# Subdirectory below output-dir; an empty string writes directly to the output root
subdir = "AIKC"
# Output image format: png, jpg, jpeg, or webp
extension = "jpg"
# JPEG/WebP quality from 1 to 100; PNG ignores this value
quality = 100
# Also write the base / USDU / ColorMatch / SeedVR2 stages
save-intermediates = false
# Write generated images to disk; source and theme modes require this for resumable
# completion state
save = true

# --- Stages / runtime ---
# Disabled stages are skipped entirely, including their model validation and loading.
#
# Run UltimateSDUpscale after base generation
run-usdu = true
# Run the SeedVR2 diffusion upscaler
run-seedvr2 = true
# PyTorch device; use cuda for the supported production path
device = "cuda"
# Model compute precision; bfloat16 is recommended for the target A100, float16
# improves compatibility, and float32 is for debugging
dtype = "bfloat16"
# Minimum severity written to the console and log file
log-level = "INFO"
# Optional rotating log file (10 MiB, five backups)
# log-file = "/data/krea2/logs/krea2pipe.log"
# Enable DEBUG logging, overriding log-level
verbose = false
