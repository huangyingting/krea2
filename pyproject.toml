[project]
name = "krea2pipe"
version = "0.1.0"
description = "Standalone Krea 2 image-generation and 4K upscaling pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.57.6",
    "safetensors>=0.7.0",
    "einops>=0.8.1",
    # numpy 2.4+ regresses color-matcher's `hm-mkl-hm` transfer by ~1.7x
    # (measured: 5.9 s vs 3.5 s on a 2496x2496 image), so cap it.
    "numpy>=2.1,<2.4",
    "pillow>=11.0",
    "scipy>=1.15",
    "opencv-python-headless>=4.10",
    "color-matcher==0.6.0",
    "spandrel==0.4.1",
    "piexif>=1.1.3",
    "tqdm>=4.66",
    # SeedVR2 upscaler stage (src/krea2pipe/seedvr2)
    "omegaconf>=2.3.0",
    "diffusers>=0.33.1",
    "rotary-embedding-torch>=0.5.3",
    "psutil>=5.9",
    "watchfiles>=1.1",
    "pathspec>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
krea2pipe = "krea2pipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krea2pipe"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
