# Generate a complete default file with `krea2pipe --generate-config`.
# This shorter example contains only the recommended service overrides.
# Run it with `krea2pipe --config krea2pipe.example.toml`. Add
# `--prompt "..."` to perform one-time generation with these same settings.
#
# Select which block is active. Settings in the other block are ignored.
prompt-mode = "source"

# --- Source mode -----------------------------------------------------------
# This may be one prompt file or a directory. Directories are scanned
# Recursively in filename order.
source = "/data/krea2/prompts"

# Keep the process alive and rescan for appended/new prompt lines. Loaded
# Models and compiled graphs remain resident, so subsequent images are fast.
watch = 10

# --- Theme mode ------------------------------------------------------------
# Change only prompt-mode to "theme" to activate these settings.
theme = "Quiet architecture where nature and technology coexist"
# Omit theme-system-prompt to use the official Krea expansion instructions,
# Or set it to custom Qwen system instructions.
# theme-system-prompt = "Expand the theme into one detailed Chinese image prompt."
# Zero means generate continuously until the service is stopped.
prompt-count = 0

# The resume ledger is stored here as .krea2pipe-progress.tsv.
output-dir = "/data/krea2/output"

# Absolute standalone model library; relative checkpoint names resolve from here.
model-root = "/data/models"

# --- Base generation -------------------------------------------------------
aspect-ratio = "1:1"
batch-size = 1
seed = "random"
steps = 8
sampler = "euler_ancestral"
scheduler = "sgm_uniform"

# --- UltimateSDUpscale -----------------------------------------------------
run-usdu = true
upscale-model = "4xNomosWebPhoto_RealPLKSR.pth"
usdu-upscale-by = 2.0
usdu-seed = "random"
usdu-steps = 2
usdu-sampler = "euler"
usdu-scheduler = "simple"
usdu-denoise = 0.1
usdu-mode = "Chess"

# --- Standalone ColorMatch -------------------------------------------------
# This is independent from SeedVR2's internal color correction.
run-color-match = true
color-match-method = "hm-mkl-hm"
color-match-strength = 0.22

# --- SeedVR2 ---------------------------------------------------------------
run-seedvr2 = true
seedvr2-resolution = 4096
seedvr2-max-resolution = 4096
seedvr2-seed = "random"
seedvr2-model = "seedvr2_ema_7b_fp16.safetensors"
seedvr2-color-correction = "lab"

# --- Separate model-upscale and blend -------------------------------------
# This model may differ from the one used by USDU.
run-blend = true
blend-upscale-model = "4xNomosWebPhoto_RealPLKSR.pth"
blend-mode = "normal"
blend-factor = 0.4

# --- Output ----------------------------------------------------------------
extension = "jpg"
quality = 100
save-intermediates = false

# --- Runtime logging -------------------------------------------------------
# Console logs are captured by journald under systemd. Set log-file to keep an
# Additional local rotating log (10 MiB per file, five backups).
log-level = "INFO"
# log-file = "/data/krea2/logs/krea2pipe.log"
